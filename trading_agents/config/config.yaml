# Trading Agents Configuration File

# LLM Settings
llm:
  provider: "openai"  # Options: openai, anthropic, ollama
  model: null  # null = use default, or specify like "gpt-4o-mini", "claude-3-5-sonnet-20241022", "llama3.1"
  temperature: 0.5
  max_tokens: 1000
  # For ollama:
  ollama_base_url: "http://localhost:11434"

# Trading Parameters
trading:
  initial_capital: 100000.0
  max_position_size: 10.0
  max_exposure_pct: 0.5  # Maximum 50% of capital in positions
  max_drawdown_pct: 0.15  # Maximum 15% drawdown allowed
  stop_loss_pct: 0.05  # 5% stop loss
  commission: 0.001  # 0.1% commission per trade

# Risk Management
risk:
  conservative_mode: false
  require_high_confidence: false  # Only trade on high confidence signals
  min_confidence_threshold: 0.6

# Data Settings
data:
  lookback_window: 20  # Bars to look back for analysis
  indicator_warmup: 50  # Minimum bars before starting trading

# Agent Settings
agents:
  market_analyst:
    temperature: 0.3
    max_tokens: 800

  news_analyst:
    temperature: 0.4
    max_tokens: 600

  strategy:
    temperature: 0.5
    max_tokens: 1000

  cio:
    temperature: 0.4
    max_tokens: 800

  risk_manager:
    temperature: 0.2
    max_tokens: 700

  execution:
    temperature: 0.1
    max_tokens: 500
    use_llm: false  # Use simple execution logic (faster)

# Logging
logging:
  log_dir: "logs"
  verbose: true
  save_on_completion: true

# Backtesting
backtest:
  start_date: null  # null = use all data
  end_date: null
  start_idx: 50  # Skip first N bars for indicator warmup
